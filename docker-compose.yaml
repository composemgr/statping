# nginx proxy address - http://172.17.0.1:8097

name: statping
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  statping:
    image: adamboutcher/statping-ng:latest
    pull_policy: always
    container_name: statping-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - statping
    ports:
      - "172.17.0.1:8097:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      ADMIN_USER: ${APP_ADMIN_USER:-admin}
      ADMIN_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
      ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      DB_CONN: ${DB_CONN:-sqlite}
      NAME: ${APP_NAME:-Statping}
      DESCRIPTION: ${APP_DESCRIPTION:-Status page for monitoring}
    volumes:
      - ./volumes/data/statping:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  statping:
    name: statping
    external: false
