# nginx proxy address - http://172.17.0.1:64354

name: statping
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: adamboutcher/statping-ng:latest
    container_name: statping-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: statping-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      ADMIN_USER: ${APP_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      DB_CONN: ${DB_CONN:-sqlite}
      NAME: ${APP_ORG_NAME:-Statping}
      DESCRIPTION: ${APP_DESCRIPTION:-Status page for monitoring}
    volumes:
      - './volumes/data/statping:/app:z'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://statping-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - statping
      - cloudflare

networks:
  statping:
    name: statping
    external: false
  cloudflare:
    external: true
